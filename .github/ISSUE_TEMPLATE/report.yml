name: Report / Signaler
description: A bug, a wrong stat or an idea (made with F9 in game) · Un bug, une stat fausse ou une idée (F9 en jeu)
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠ Drop the zip made by F9 in the "What happened" box below, and wait for its link before submitting
        The folder opened by F9: `%APPDATA%\SlayTheSpire2\KikiMAIster\feedback\` (player names and Steam ids are already removed).
        Without the zip, the report cannot be checked.

        ## ⚠ Glisse le zip créé par F9 dans la case « Ce qui s'est passé » ci-dessous, et attends son lien avant d'envoyer
        Le dossier ouvert par F9 : `%APPDATA%\SlayTheSpire2\KikiMAIster\feedback\` (les noms des joueurs et les ids Steam sont déjà retirés).
        Sans le zip, le rapport ne peut pas être vérifié.
  - type: input
    id: kind
    attributes:
      label: Type
      placeholder: Bug / Wrong stat / Idea
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mod version · Version du mod
      placeholder: "0.18.0"
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Game branch · Branche du jeu
      placeholder: main / beta
  - type: textarea
    id: description
    attributes:
      label: What happened · Ce qui s'est passé
      description: What you expected, the fight, the turn, the card… and DROP THE ZIP HERE · Ce que tu attendais, le combat, le tour, la carte… et GLISSE LE ZIP ICI
    validations:
      required: true
